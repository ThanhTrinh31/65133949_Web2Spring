<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới Post</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold;}
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .cancel-btn { padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; margin-left: 10px; border-radius: 4px;}
    </style>
</head>
<body>

    <h2>Thêm mới một Bài viết (Yêu cầu 4.b)</h2>

    <form th:action="@{/post/new}" th:object="${postMoi}" method="POST">
        
        <div class="form-group">
            <label>ID:</label>
            <input type="number" th:field="*{id}" required />
        </div>

        <div class="form-group">
            <label>Tiêu đề (Title):</label>
            <input type="text" th:field="*{title}" required />
        </div>

        <div class="form-group">
            <label>Nội dung (Content):</label>
            <input type="text" th:field="*{content}" />
        </div>

        <div class="form-group">
            <label>Mã thể loại (Category ID):</label>
            <input type="number" th:field="*{categoryId}" value="1" />
        </div>

        <div class="form-group">
            <label>Ảnh Thumbnail (Tên file):</label>
            <input type="text" th:field="*{thumbnailImage}" placeholder="VD: hinh1.jpg" />
        </div>

        <br>
        <button type="submit">💾 Lưu Bài Viết</button>
        <a href="/post/all" class="cancel-btn">Hủy bỏ</a>
    </form>

</body>
</html>
