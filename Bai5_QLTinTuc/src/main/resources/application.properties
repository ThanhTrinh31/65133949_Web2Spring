# 1. Kết nối DB (Thay 'ql_tintuc' bằng tên Database bạn đã tạo trong phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/ql_tintuc?useSSL=false&serverTimezone=UTC

# 2. Tài khoản mặc định của XAMPP
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Cấu hình Hibernate (Tự động tạo bảng từ code Java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect