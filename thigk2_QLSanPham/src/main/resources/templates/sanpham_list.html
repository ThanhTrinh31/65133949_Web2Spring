<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Danh sách Sản phẩm</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background-color: #f8f9fa;
}

.container {
	margin-top: 40px;
	background: white;
	padding: 30px;
	border-radius: 10px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.top-header {
	border-bottom: 2px solid #eee;
	padding-bottom: 15px;
	margin-bottom: 25px;
}
</style>
</head>
<body>
	<div class="container">

		<div
			class="top-header d-flex justify-content-between align-items-center">
			<h2 class="text-primary fw-bold m-0">DANH SÁCH SẢN PHẨM</h2>

			<div class="user-actions">
				<a th:if="${session.userLogedIn == null}" href="/login"
					class="btn btn-success fw-bold">🔑 Đăng nhập</a> <span
					th:if="${session.userLogedIn != null}"
					class="d-flex align-items-center"> <span class="me-3">Chào,
						<b th:text="${session.userLogedIn.username}" class="text-danger"></b>!
				</span> <a href="/logout" class="btn btn-danger fw-bold">🚪 Đăng xuất</a>
				</span>
			</div>
		</div>

		<div class="mb-4 d-flex align-items-center">
			<b class="me-3">🔍 Lọc theo thể loại:</b> <a href="/sanpham"
				class="btn btn-outline-dark btn-sm me-2 fw-bold">Tất cả</a> <span
				th:each="tl : ${listTL}"> <a
				th:href="@{/sanpham(idTL=${tl.id})}" th:text="${tl.tenTheLoai}"
				class="btn btn-outline-primary btn-sm me-2 fw-bold"></a>
			</span>
		</div>

		<table
			class="table table-striped table-hover table-bordered align-middle">
			<thead class="table-dark">
				<tr>
					<th class="text-center" style="width: 10%">Mã SP</th>
					<th style="width: 35%">Tên sản phẩm</th>
					<th style="width: 20%">Giá bán</th>
					<th style="width: 20%">Thể loại</th>
					<th class="text-center" style="width: 15%">Thao tác</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="sp : ${listSP}">
					<td class="text-center" th:text="${sp.id}"></td>
					<td class="fw-bold" th:text="${sp.tenSP}"></td>
					<td class="text-danger fw-bold"
						th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
					<td th:text="${sp.theLoai.tenTheLoai}"></td>
					<td class="text-center"><a
						th:href="@{/sanpham/chitiet/{id}(id=${sp.id})}"
						class="btn btn-sm btn-info text-white fw-bold">👀 Chi tiết</a></td>
				</tr>
				<tr th:if="${#lists.isEmpty(listSP)}">
					<td colspan="5" class="text-center text-muted py-4">Không có
						sản phẩm nào trong danh mục này.</td>
				</tr>
			</tbody>
		</table>

	</div>
</body>
</html>
