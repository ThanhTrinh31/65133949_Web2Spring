<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        
        /* CSS đẩy nút lên góc phải */
        .top-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .user-actions a { text-decoration: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
        .btn-login { background-color: #28a745; color: white; }
        .btn-logout { background-color: #dc3545; color: white; }
        
        .filter { margin: 20px 0; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>DANH SÁCH SẢN PHẨM</h1>
        
        <div class="user-actions">
            <a th:if="${session.userLogedIn == null}" href="/login" class="btn-login">🔑 Đăng nhập</a>
            
            <span th:if="${session.userLogedIn != null}">
                Chào, <b th:text="${session.userLogedIn.username}"></b> | 
                <a href="/logout" class="btn-logout">🚪 Đăng xuất</a>
            </span>
        </div>
    </div>
    
    <div class="filter">
        <b>🔍 Lọc theo thể loại:</b>
        <a href="/sanpham">Tất cả</a> | 
        <span th:each="tl : ${listTL}">
            <a th:href="@{/sanpham(idTL=${tl.id})}" th:text="${tl.tenTheLoai}"></a> |
        </span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Mã SP</th>
                <th>Tên sản phẩm</th>
                <th>Giá bán</th>
                <th>Thể loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sp : ${listSP}">
                <td th:text="${sp.id}"></td>
                <td th:text="${sp.tenSP}"></td>
                <td th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td th:text="${sp.theLoai.tenTheLoai}"></td>
                <td>
                    <a th:href="@{/sanpham/chitiet/{id}(id=${sp.id})}">Chi tiết</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
