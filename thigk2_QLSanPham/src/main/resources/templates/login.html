<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <style>
        .login-box { width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .error-msg { color: red; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="text-align: center;">ĐĂNG NHẬP</h2>
        
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        
        <form action="/login" method="post">
            <p>
                <label>Tên đăng nhập:</label><br>
                <input type="text" name="username" required style="width: 100%; padding: 5px;">
            </p>
            <p>
                <label>Mật khẩu:</label><br>
                <input type="password" name="password" required style="width: 100%; padding: 5px;">
            </p>
            <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none;">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
