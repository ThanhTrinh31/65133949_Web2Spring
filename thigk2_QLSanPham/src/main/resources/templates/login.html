<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Đăng nhập</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center"
	style="height: 100vh;">
	<div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
		<h2 class="text-center text-primary mb-4 fw-bold">ĐĂNG NHẬP</h2>

		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

		<form action="/login" method="post">
			<div class="mb-3">
				<label class="form-label fw-bold">Tài khoản:</label> <input
					type="text" name="username" class="form-control" required
					placeholder="Nhập admin...">
			</div>
			<div class="mb-4">
				<label class="form-label fw-bold">Mật khẩu:</label> <input
					type="password" name="password" class="form-control" required
					placeholder="Nhập 123456...">
			</div>
			<button type="submit" class="btn btn-primary w-100 fw-bold fs-5">Đăng
				nhập</button>
		</form>
	</div>
</body>
</html>
