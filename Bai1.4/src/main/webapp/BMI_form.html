<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tính BMI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card {
    background:white;
    padding:30px;
    border-radius:16px;
    width:380px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

input, button {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button {
    background:#667eea;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<h2>Tính BMI</h2>

<form action="BMI" method="post">
    Chiều cao (m):
    <input type="number" step="0.01" name="height" required>

    Cân nặng (kg):
    <input type="number" step="0.1" name="weight" required>

    <button type="submit">Tính BMI</button>
</form>

</div>

</body>
</html>
