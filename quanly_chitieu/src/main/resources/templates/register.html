<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đăng Ký Thành Viên</h2>
        
        <p th:if="${error}" class="text-red-500 text-sm mb-4 text-center" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Tài khoản</label>
                <input type="text" th:field="*{username}" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Mật khẩu</label>
                <input type="password" th:field="*{password}" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
                <input type="email" th:field="*{email}" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium p-2 rounded transition shadow-sm">
                Đăng Ký
            </button>
        </form>
        <p class="text-sm text-center text-gray-500 mt-4">Đã có tài khoản? <a th:href="@{/login}" class="text-blue-600 hover:underline">Đăng nhập</a></p>
    </div>
</body>
</html>
