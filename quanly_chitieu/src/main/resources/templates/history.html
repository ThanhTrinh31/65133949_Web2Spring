<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch Sử Chi Tiêu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md">
        
        <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200">
            <div class="flex items-center gap-4">
                <a th:href="@{/}" class="text-blue-600 hover:underline font-medium">← Quay lại Dashboard</a>
                <h1 class="text-2xl font-bold text-gray-800">📜 Lịch Sử & Bộ Lọc Giao Dịch</h1>
            </div>
            <span class="text-gray-600 font-medium" th:text="'Xin chào, ' + ${user.username}"></span>
        </div>

        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
            <form th:action="@{/history}" method="GET" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Từ ngày</label>
                    <input type="date" name="startDate" th:value="${startDate}" class="w-full p-2 border border-gray-300 rounded focus:outline-none bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Đến ngày</label>
                    <input type="date" name="endDate" th:value="${endDate}" class="w-full p-2 border border-gray-300 rounded focus:outline-none bg-white">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded transition shadow-sm">
                    🔍 Lọc dữ liệu
                </button>
            </form>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="p-4 bg-green-50 border-l-4 border-green-500 rounded-r shadow-sm">
                <p class="text-xs text-gray-500 uppercase font-semibold">Tổng thu nhập trong kỳ</p>
                <p class="text-xl font-bold text-green-600" th:text="'+' + ${#numbers.formatDecimal(totalIncome, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>
            </div>
            <div class="p-4 bg-red-50 border-l-4 border-red-500 rounded-r shadow-sm">
                <p class="text-xs text-gray-500 uppercase font-semibold">Tổng chi tiêu trong kỳ</p>
                <p class="text-xl font-bold text-red-600" th:text="'-' + ${#numbers.formatDecimal(totalExpense, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>
            </div>
        </div>

        <div>
           <div class="flex justify-between items-center mb-3">
			    <h2 class="text-lg font-semibold text-gray-700">Danh sách giao dịch tìm thấy</h2>
			    
			    <a th:href="@{/history/export(startDate=${startDate}, endDate=${endDate})}" 
			       class="inline-flex items-center gap-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded transition shadow-sm">
			        💚 Xuất báo cáo Excel
			    </a>
			</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider">
                            <th class="p-3 border-b border-gray-200">Ngày giao dịch</th>
                            <th class="p-3 border-b border-gray-200">Danh mục</th>
                            <th class="p-3 border-b border-gray-200">Ghi chú</th>
                            <th class="p-3 border-b border-gray-200 text-right">Số tiền</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm text-gray-700">
                        <tr th:if="${#lists.isEmpty(transactions)}">
                            <td colspan="4" class="p-3 text-center text-gray-400 italic">Không tìm thấy giao dịch nào trong khoảng thời gian đã chọn.</td>
                        </tr>
                        <tr th:each="t : ${transactions}" class="hover:bg-gray-50 border-b border-gray-200">
                            <td class="p-3" th:text="${t.transactionDate}"></td>
                            <td class="p-3">
                                <span th:text="${t.category.name}" class="px-2 py-1 rounded text-xs font-semibold bg-gray-200 text-gray-800"></span>
                            </td>
                            <td class="p-3 text-gray-500" th:text="${t.note}"></td>
                            <td class="p-3 text-right font-semibold" 
                                th:text="${t.category.type == 'INCOME' ? '+' : '-'} + ${#numbers.formatDecimal(t.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                th:classappend="${t.category.type == 'INCOME' ? 'text-green-600' : 'text-red-600'}">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
