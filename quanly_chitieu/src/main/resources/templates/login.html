<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đăng Nhập Hệ Thống</h2>
        
        <p th:if="${error}" class="text-red-500 text-sm mb-4 text-center" th:text="${error}"></p>

        <form th:action="@{/login}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Tài khoản</label>
                <input type="text" name="username" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Mật khẩu</label>
                <input type="password" name="password" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded transition shadow-sm">
                Đăng Nhập
            </button>
        </form>
        <p class="text-sm text-center text-gray-500 mt-4">Chưa có tài khoản? <a th:href="@{/register}" class="text-blue-600 hover:underline">Đăng ký ngay</a></p>
    </div>
</body>
</html>
