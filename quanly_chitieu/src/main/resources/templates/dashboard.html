<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actual Budget - Quản Lý Chi Tiêu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800">📊 Quản Lý Chi Tiêu Cá Nhân</h1>
            <div class="flex items-center gap-3">
                <span class="text-gray-600 font-medium mr-2" th:text="'Xin chào, ' + ${user.username}"></span>
                <a th:href="@{/categories}" class="text-sm bg-blue-100 hover:bg-blue-200 text-blue-600 font-semibold px-3 py-1.5 rounded transition shadow-sm">📁 Quản lý danh mục</a>
                <a th:href="@{/history}" class="text-sm bg-amber-100 hover:bg-amber-200 text-amber-700 font-semibold px-3 py-1.5 rounded transition shadow-sm">📜 Lịch sử bộ lọc</a>
                <a th:href="@{/logout}" class="text-sm bg-red-100 hover:bg-red-200 text-red-600 font-semibold px-3 py-1.5 rounded transition shadow-sm">Đăng xuất</a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="p-4 bg-blue-50 border-l-4 border-blue-500 rounded-r shadow-sm">
                <p class="text-sm text-gray-500 uppercase tracking-wider font-semibold">Số dư hiện tại</p>
                <p class="text-2xl font-bold text-blue-600" th:text="${#numbers.formatDecimal(balance, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 space-y-6">
                <div class="p-4 rounded-lg border transition duration-300" 
                     th:classappend="${isEditing} ? 'bg-amber-50 border-amber-300' : 'bg-gray-50 border-gray-200'">
                    
                    <h2 class="text-lg font-semibold text-gray-700 mb-3" 
                        th:text="${isEditing} ? '✏️ Cập nhật giao dịch' : 'Thêm giao dịch mới'"></h2>
                    
                    <form th:action="@{/transaction/add}" th:object="${newTransaction}" method="POST" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                        <input type="hidden" th:field="*{id}" />

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Số tiền</label>
                            <input type="number" th:field="*{amount}" required class="w-full p-2 border border-gray-300 rounded focus:outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Ghi chú</label>
                            <input type="text" th:field="*{note}" placeholder="Ghi chú..." class="w-full p-2 border border-gray-300 rounded focus:outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Danh mục</label>
                            <select name="categoryId" required class="w-full p-2 border border-gray-300 rounded focus:outline-none bg-white">
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="|${cat.name} (${cat.type})|"
                                        th:selected="${newTransaction.category != null and newTransaction.category.id == cat.id}"></option>
                            </select>
                        </div>
                        <button type="submit" class="w-full font-medium p-2 rounded transition shadow-sm text-white"
                                th:classappend="${isEditing} ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'"
                                th:text="${isEditing} ? 'Cập nhật' : 'Thêm'">
                        </button>
                    </form>
                </div>

                <div>
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">Lịch sử giao dịch</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider">
                                    <th class="p-3 border-b border-gray-200">Ngày</th>
                                    <th class="p-3 border-b border-gray-200">Danh mục</th>
                                    <th class="p-3 border-b border-gray-200">Ghi chú</th>
                                    <th class="p-3 border-b border-gray-200 text-right">Số tiền</th>
                                    <th class="p-3 border-b border-gray-200 text-center">Hành động</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-700">
                                <tr th:if="${#lists.isEmpty(transactions)}">
                                    <td colspan="5" class="p-3 text-center text-gray-400 italic">Chưa có giao dịch nào.</td>
                                </tr>
                                <tr th:each="t : ${transactions}" class="hover:bg-gray-50 transition border-b border-gray-200"
                                    th:classappend="${budgetAlertMap[t.category.id]} ? 'bg-red-50 hover:bg-red-100' : ''">
                                    
                                    <td class="p-3" th:text="${t.transactionDate}"></td>
                                    <td class="p-3">
                                        <span th:text="${t.category.name}" class="px-2 py-1 rounded text-xs font-semibold bg-gray-200 text-gray-800"></span>
                                        <span th:if="${budgetAlertMap[t.category.id] and t.category.type == 'EXPENSE'}" class="text-red-500 ml-1 font-bold text-xs" title="Vượt hạn mức chi tiêu!">⚠️ Vượt hạn mức</span>
                                    </td>
                                    <td class="p-3 text-gray-500" th:text="${t.note}"></td>
                                    <td class="p-3 text-right font-semibold" 
                                        th:text="${t.category.type == 'INCOME' ? '+' : '-'} + ${#numbers.formatDecimal(t.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                        th:classappend="${t.category.type == 'INCOME' ? 'text-green-600' : 'text-red-600'}">
                                    </td>
                                    <td class="p-3 text-center space-x-1">
                                        <a th:href="@{/transaction/edit/{id}(id=${t.id})}" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-700 font-semibold px-2 py-1 rounded transition">Sửa</a>
                                        <a th:href="@{/transaction/delete/{id}(id=${t.id})}" 
                                           onclick="return confirm('Bạn chắc chắn muốn xóa giao dịch này chứ?')"
                                           class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-semibold px-2 py-1 rounded transition">Xóa</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col items-center h-fit">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 self-start">Tỷ lệ chi tiêu tháng này</h2>
                <div class="w-full max-w-[280px]">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script th:inline="javascript">
        const labelsData = /*[[${chartLabels}]]*/ [];
        const amountData = /*[[${chartData}]]*/ [];
        const ctx = document.getElementById('expenseChart').getContext('2d');
        
        if(labelsData.length === 0) {
            new Chart(ctx, { type: 'doughnut', data: { labels: ['Chưa có dữ liệu chi'], datasets: [{ data: [1], backgroundColor: ['#E5E7EB'] }] }, options: { responsive: true } });
        } else {
            new Chart(ctx, { type: 'doughnut', data: { labels: labelsData, datasets: [{ label: 'Tổng chi (đ)', data: amountData, backgroundColor: ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899'], borderWidth: 1 }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } });
        }
    </script>
</body>
</html>
