spring.application.name=quanly_chitieu

# 1. Cấu hình cổng chạy ứng dụng Spring Boot (Mặc định là 8080, bạn có thể đổi nếu muốn)
server.port=8080

# 2. Cấu hình kết nối cơ sở dữ liệu MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Cấu hình Hibernate / JPA
# Chọn 'update' để Spring Boot tự động tạo/cập nhật bảng trong MySQL dựa trên các class Java (Entity) bạn viết
spring.jpa.hibernate.ddl-auto=update

# Hiển thị các câu lệnh SQL mà Spring Boot thực thi xuống console (rất tiện để debug khi làm việc với Thymeleaf)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# 4. Cấu hình Thymeleaf (Để cập nhật giao diện ngay lập tức khi bạn sửa file HTML mà không cần restart server)
spring.thymeleaf.cache=false