<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>About Me</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.card {
    background: white;
    width: 420px;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 15px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 42px;
    font-weight: bold;
}
.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 15px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.info {
    margin-top: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.label {
    color: #666;
}

.value {
    font-weight: 600;
    color: #222;
}

.badges {
    margin-top: 15px;
    text-align: center;
}

.badge {
    display: inline-block;
    background: #eef2ff;
    color: #4f46e5;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    margin: 4px;
}

.footer {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #777;
}

</style>
</head>

<body>

<div class="card">

    <div class="avatar">
    <img src="/Bai1.3/image/AnhChanDung.jpg" alt="avatar">
</div>

    

    <h2>Huỳnh Thanh Trình</h2>

    <div class="info">
        <div class="row">
            <div class="label">Ngành</div>
            <div class="value">Công nghệ thông tin</div>
        </div>

        <div class="row">
            <div class="label">Định hướng</div>
            <div class="value">Web + AI</div>
        </div>

        <div class="row">
            <div class="label">Mục tiêu</div>
            <div class="value">Developer quốc tế</div>
        </div>
    </div>

    <div class="badges">
        <span class="badge">Java</span>
        <span class="badge">Servlet</span>
        <span class="badge">Web Dev</span>
        <span class="badge">SQL</span>
    </div>

    <div class="footer">
        Servlet AboutMe Demo
    </div>

</div>

</body>
</html>
